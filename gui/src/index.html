<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paranoia 解密工具</title>
  <link rel="icon" href="app-icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <img src="app-icon.png" width="44" height="44" alt="" draggable="false" aria-hidden="true" />
        </div>
        <div class="brand-text">
          <h1>Paranoia 解密工具</h1>
          <p>Paranoia File Encryption v4 · AES-256</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        <span id="statusHint">就绪</span>
      </div>
    </header>

    <main class="content">
      <section class="panel file-panel">
        <div class="panel-head">
          <div class="panel-title">
            <h2>文件列表</h2>
            <span class="count-badge" id="fileCount">0</span>
          </div>
          <div class="head-actions">
            <button class="btn btn-ghost" id="btnClear" type="button" title="清空文件列表">清空</button>
            <button class="btn btn-accent-ghost" id="btnAdd" type="button" title="选择 .enc 文件（可多选）">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              添加文件
            </button>
          </div>
        </div>

        <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="拖拽 .enc 文件到此处添加，或按回车打开文件选择器">
          <svg class="dz-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
            <path d="M12 16V5m0 0L7.8 9.2M12 5l4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4.5 15.5v2.2A2.3 2.3 0 0 0 6.8 20h10.4a2.3 2.3 0 0 0 2.3-2.3v-2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <div class="dz-text">
            <strong>拖拽 .enc 文件到此处</strong>
            <span>支持多选批量添加，也可点击「添加文件」选择</span>
          </div>
        </div>

        <div class="file-list" id="fileList" role="list" aria-label="待解密文件"></div>
        <div class="empty-hint" id="emptyHint">尚未添加文件 — 添加后将在此显示每个文件的解密状态</div>
      </section>

      <div class="settings-grid">
        <section class="panel setting-card">
          <div class="setting-label">密码<span class="setting-hint">加密时设置的密码</span></div>
          <div class="password-field">
            <input id="passwordInput" type="password" class="text-input" placeholder="输入解密密码" autocomplete="off" spellcheck="false" aria-label="解密密码" />
            <button class="icon-btn" id="btnTogglePassword" type="button" title="显示密码" aria-label="显示或隐藏密码">
              <svg class="eye-on" viewBox="0 0 20 20" width="17" height="17" fill="none" aria-hidden="true">
                <path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 20 20" width="17" height="17" fill="none" aria-hidden="true">
                <path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="m3.5 3.5 13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="setting-row">
            <label class="checkbox"><input type="checkbox" id="rememberPassword" /><span>记住密码</span></label>
            <button class="link-btn" id="btnClearPassword" type="button" title="清除本机保存的密码">清除记忆</button>
          </div>
          <div class="setting-foot" id="configHint" title="">密码以明文保存在本机配置文件中</div>
        </section>

        <section class="panel setting-card">
          <div class="setting-label">输出目录</div>
          <div class="path-display" id="outputDirDisplay" title=""><span class="path-text">（尚未添加文件）</span></div>
          <div class="setting-row">
            <button class="btn btn-small" id="btnChooseOut" type="button">选择目录…</button>
            <button class="btn btn-small btn-ghost" id="btnResetOut" type="button" disabled>恢复默认</button>
          </div>
          <div class="setting-foot" id="outputHint">默认：首个文件所在目录</div>
        </section>

        <section class="panel setting-card">
          <div class="setting-label">冲突策略<span class="setting-hint">输出文件同名时</span></div>
          <div class="select-wrap">
            <select id="conflictSelect" class="select" aria-label="冲突策略">
              <option value="rename" selected>自动改名</option>
              <option value="overwrite">覆盖</option>
              <option value="error">报错</option>
            </select>
            <svg viewBox="0 0 12 12" width="11" height="11" fill="none" aria-hidden="true"><path d="m2.5 4.5 3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div class="setting-foot" id="conflictHint">自动追加 (1)、(2) 等后缀，绝不覆盖已有文件</div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="overall">
        <div class="overall-head">
          <span id="overallLabel">等待开始</span>
          <span id="overallPct">0%</span>
        </div>
        <div class="overall-bar"><div class="overall-fill" id="overallFill"></div></div>
        <div class="overall-meta">
          <span class="stat stat-ok">成功 <b id="statOk">0</b></span>
          <span class="stat stat-fail">失败 <b id="statFail">0</b></span>
          <span class="stat stat-total" id="statTotal">0 / 0 个文件</span>
          <button class="link-btn" id="btnOpenOut" type="button" hidden>打开输出目录</button>
        </div>
      </div>
      <button class="btn btn-primary btn-start" id="btnStart" type="button" disabled>
        <span class="start-label">开始解密</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <template id="fileRowTemplate">
    <div class="file-row" role="listitem">
      <div class="file-kind" aria-hidden="true">ENC</div>
      <div class="file-main">
        <div class="file-name-row">
          <span class="file-name"></span>
          <span class="file-badge"></span>
        </div>
        <div class="file-sub"><span class="file-path"></span><span class="file-size"></span></div>
        <div class="file-bar"><div class="file-fill"></div></div>
      </div>
      <div class="file-status">等待中</div>
      <button class="row-remove" type="button" title="移除该文件" aria-label="移除该文件">×</button>
    </div>
  </template>

  <script src="main.js"></script>
</body>
</html>
