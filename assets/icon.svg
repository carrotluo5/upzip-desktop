<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3D97FF"/>
      <stop offset="0.55" stop-color="#1470F0"/>
      <stop offset="1" stop-color="#0640B4"/>
    </linearGradient>
    <linearGradient id="flapL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8E8FF"/>
    </linearGradient>
    <linearGradient id="flapR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE1FF"/>
    </linearGradient>
    <linearGradient id="boxFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#DCE9FF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE07A"/>
      <stop offset="0.5" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#E89A00"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#001F5C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- app tile -->
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="228" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>
  <!-- open box lid flaps -->
  <g filter="url(#softShadow)">
    <polygon points="352,470 180,318 400,268 486,466" fill="url(#flapL)"/>
    <polygon points="672,470 844,318 624,268 538,466" fill="url(#flapR)"/>
  </g>
  <!-- box interior -->
  <rect x="300" y="452" width="424" height="150" rx="32" fill="#0A2C70"/>
  <!-- box body -->
  <g filter="url(#softShadow)">
    <rect x="286" y="462" width="452" height="368" rx="42" fill="url(#boxFace)"/>
  </g>
  <!-- box front seam -->
  <rect x="286" y="566" width="452" height="16" fill="#C9DBFA" opacity="0.55"/>
  <!-- zipper teeth on the front seam -->
  <g fill="#7FA8E8">
    <rect x="330" y="566" width="26" height="16" rx="7"/>
    <rect x="392" y="566" width="26" height="16" rx="7"/>
    <rect x="454" y="566" width="26" height="16" rx="7"/>
    <rect x="516" y="566" width="26" height="16" rx="7"/>
    <rect x="578" y="566" width="26" height="16" rx="7"/>
    <rect x="640" y="566" width="26" height="16" rx="7"/>
  </g>
  <!-- keyhole plate -->
  <circle cx="512" cy="680" r="58" fill="#0A2C70"/>
  <path d="M512 664 a22 22 0 0 1 22 22 c0 9 -5 16 -12 20 l10 44 h-40 l10 -44 c-7 -4 -12 -11 -12 -20 a22 22 0 0 1 22 -22 z" fill="#FFFFFF"/>
  <!-- open padlock overlapping bottom right -->
  <g transform="rotate(-8 700 760)">
    <path d="M648 742 v-38 a52 52 0 0 1 104 0" fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round"/>
    <rect x="608" y="736" width="184" height="150" rx="32" fill="url(#gold)"/>
    <circle cx="700" cy="792" r="24" fill="#7A4A00"/>
    <rect x="688" y="800" width="24" height="48" rx="12" fill="#7A4A00"/>
    <rect x="608" y="736" width="184" height="150" rx="32" fill="none" stroke="#B26F00" stroke-opacity="0.4" stroke-width="5"/>
  </g>
</svg>