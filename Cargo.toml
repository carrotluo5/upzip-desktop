[workspace]
resolver = "2"
members = ["crates/core", "crates/unpack-core", "crates/embedded-7z", "crates/cli", "gui/src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/unparanoia"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "fs", "io-util", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
dirs = "6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
unparanoia-core = { path = "crates/core" }
unparanoia-unpack-core = { path = "crates/unpack-core" }
unparanoia-embedded-7z = { path = "crates/embedded-7z" }

# Release profile shared by the CLI and the GUI app.
# NOTE: the previous paranoia build used opt-level="s" + panic="abort"; the merged
# build uses upzip's size/speed profile and unwinds so the GUI can catch panics in
# batch worker threads (see docs/DEV-CONTRACT.md "build profile changes").
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Keep the heavy crypto crates optimized even in dev/test builds, otherwise
# Argon2id (20 iterations, 20 MiB) makes the test suite unnecessarily slow.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.skein]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3