# CI: 构建 + 测试 + 打包
#
# 说明（诚实边界）:
#   - 本仓库没有配置远端，此 workflow 尚未在 GitHub 上实际运行过；本地用手工命令
#     验证过同等流程（docs/VERIFICATION.md）。首次 push 后请以 CI 结果为准。
#   - Java Oracle 的"真实样本全链路验证"依赖仓库外的官方 Java 源码树与真实样本，
#     CI 无法运行；CI 只跑可离线回放的 verification/oracle/test-vectors.json
#     （cargo test --workspace 已包含）。
#   - Windows job 的 NSIS 打包在 CI 上属于首次真机验证机会；若失败请以日志修配置，
#     不要把步骤改成忽略错误。
name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # macOS: 单测 + 前端 + e2e + tauri 打包（.app / .dmg）
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: Build CLI (release)
        run: cargo build --release -p unparanoia-cli

      - name: Make e2e fixtures
        run: ./scripts/make-fixtures.sh

      - name: Run CLI e2e
        run: ./scripts/e2e-verify.sh

      - name: Install frontend deps
        run: pnpm --dir gui install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir gui build

      - name: Build Tauri app (app + dmg)
        run: pnpm --dir gui tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unparanoia-macos
          if-no-files-found: warn
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/unparanoia-cli

  # ---------------------------------------------------------------------------
  # Windows: 单测 + 前端 + NSIS 安装包（首次真机验证机会）
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: cargo test (workspace)
        run: cargo test --workspace

      # 先构建前端 dist：Tauri 的 release 打包需要 gui/dist 存在（beforeBuildCommand 也会重建）。
      - name: Install frontend deps
        run: pnpm --dir gui install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir gui build

      - name: Build CLI (release)
        run: cargo build --release -p unparanoia-cli

      - name: CLI smoke test
        shell: pwsh
        run: |
          .\target\release\unparanoia-cli.exe --version
          .\target\release\unparanoia-cli.exe doctor

      - name: Build Tauri installer (NSIS)
        run: pnpm --dir gui tauri build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unparanoia-windows
          if-no-files-found: warn
          path: |
            target/release/bundle/nsis/*.exe
            target/release/unparanoia.exe
            target/release/unparanoia-cli.exe
