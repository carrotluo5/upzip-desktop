# CI: 构建 + 测试 + 打包
#
# 说明（诚实边界）:
#   - 本 workflow 首次在 GitHub 远端运行即为真机验证；此前只用本地手工命令跑过
#     同等流程（docs/VERIFICATION.md）。CI 结果与本地记录不一致时以 CI 为准。
#   - Java Oracle 的"真实样本全链路验证"依赖仓库外的官方 Java 源码树与真实样本，
#     CI 无法运行；CI 只跑可离线回放的 verification/oracle/test-vectors.json
#     （cargo test --workspace 已包含）。
#   - Windows job 构建的是单 exe 便携 zip（GUI 用裸 cargo 构建，必须带
#     --features custom-protocol，否则 exe 会连 devUrl localhost:1420 白屏）；
#     这属于首次真机验证机会，若失败请以日志修配置，不要把步骤改成忽略错误。
name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # macOS: 单测 + 前端 + e2e + tauri 打包（.app / .dmg）
  # ---------------------------------------------------------------------------
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: Build CLI (release)
        run: cargo build --release -p upzip-cli

      - name: Make e2e fixtures
        run: ./scripts/make-fixtures.sh

      - name: Run CLI e2e
        run: ./scripts/e2e-verify.sh

      - name: Install frontend deps
        run: pnpm --dir gui install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir gui build

      - name: Build Tauri app (app + dmg)
        run: pnpm --dir gui tauri build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upzip-macos
          if-no-files-found: warn
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/upzip-cli

  # ---------------------------------------------------------------------------
  # Windows: 单测 + 单 exe 便携包（首次真机验证机会）
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: cargo test (workspace)
        run: cargo test --workspace

      # 前端 dist 必须先构建：Tauri 在编译期把 dist 内嵌进 exe（自定义协议）。
      - name: Install frontend deps
        run: pnpm --dir gui install --frozen-lockfile

      - name: Sync bundled 7-Zip resources
        run: pnpm --dir gui sync:binaries

      - name: Build frontend
        run: pnpm --dir gui build

      - name: Build CLI (release)
        run: cargo build --release -p upzip-cli

      # 裸 cargo 构建 GUI 必须带 --features custom-protocol；否则 exe 使用 devUrl
      # http://localhost:1420，在 CI/用户机器上白屏。
      - name: Build GUI (release, custom-protocol)
        run: cargo build --release -p upzip --features custom-protocol

      - name: CLI smoke test
        shell: pwsh
        run: |
          .\target\release\upzip-cli.exe --version
          .\target\release\upzip-cli.exe doctor

      - name: Package single-exe portable zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $pkg = "target/windows-portable/Upzip-$ver-win-x64-portable"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item target/release/upzip.exe "$pkg/Upzip.exe"
          Copy-Item target/release/upzip-cli.exe "$pkg/upzip-cli.exe"
          Copy-Item binaries/7z-LICENSE.txt "$pkg/7z-LICENSE.txt"
          @(
            "Upzip（智能批量解压）$ver — Windows x64 便携版（单 exe）",
            "两个 exe 均已内嵌 7-Zip 25.01；首次运行解压到 %LOCALAPPDATA%\Upzip\embedded-7z\25.01-r1\（可用 UPZIP_7Z_CACHE_DIR 覆盖缓存根目录）。",
            "要求 Windows 10/11 x64 + WebView2 Runtime；免安装；未签 Authenticode。"
          ) | Set-Content -Encoding UTF8 "$pkg/README.txt"
          $lines = foreach ($f in Get-ChildItem $pkg -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower(), $f.Name
          }
          $lines | Set-Content -Encoding ASCII "$pkg/SHA256SUMS"
          Compress-Archive -Path "$pkg/*" -DestinationPath "target/windows-portable/Upzip-$ver-win-x64-portable.zip"

      - name: Upload Windows portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upzip-windows
          if-no-files-found: warn
          path: |
            target/windows-portable/*.zip
            target/release/upzip.exe
            target/release/upzip-cli.exe
